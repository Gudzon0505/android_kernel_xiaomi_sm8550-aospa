name: Сборка ULTIMATE Гаджи-Ядра для Poco F6 Pro

on:
  workflow_dispatch:

jobs:
  build:
    name: Компиляция пользовательского ядра Гаджи
    runs-on: ubuntu-latest
    steps:
      - name: 1. Загрузка исходников ядра
        uses: actions/checkout@v4

      - name: 2. Установка системных зависимостей (Ubuntu 24.04 Fixed)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib git gnupg gperf liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 dwarves libelf-dev zstd

      - name: 3. Установка тулчейна (Neutron Clang)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 4. Настройка переменных окружения
        run: |
          echo "KBUILD_BUILD_USER=Gadzhi" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub_Actions" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: 5. Загрузка ReSukiSU (Нативный метод Checkout)
        uses: actions/checkout@v4
        with:
          repository: ReSukiSU/ReSukiSU
          path: ksutmp # Качаем во временную папку через официальный канал

      - name: 6. Интеграция ReSukiSU в дерево ядра
        run: |
          # Создаем папку драйверов и копируем файлы
          mkdir -p drivers/kernelsu
          cp -r ksutmp/kernel/* drivers/kernelsu/
          
          # Прописываем компиляцию в Makefile
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # Регистрируем Kconfig
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          echo "✅ ReSukiSU вшит в драйверы"

      - name: 7. Интеграция патчей SUSFS v2.10 (База GKI 5.15)
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_patches
          
          # Перенос файлов патчей
          cp -r susfs_patches/kernel_patches/fs/* ./fs/
          cp -r susfs_patches/kernel_patches/include/linux/* ./include/linux/
          
          # Накладываем основной патч ядра
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch | head -n 1)
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" || echo "Патч ядра уже наложен"
          fi
          
          # Накладываем патч на KernelSU (ReSukiSU)
          KSU_PATCH=$(ls susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch | head -n 1)
          if [ -f "$KSU_PATCH" ]; then
            cd drivers/kernelsu
            patch -p1 --forward < "../../$KSU_PATCH" || echo "Патч для KSU применен"
            cd ../..
          fi

      - name: 8. Конфигурация ядра (Poco F6 Pro / vermeer)
        run: |
          chmod +x scripts/config || true
          
          # Поиск дефконфига
          DEFCONFIG=$(find arch/arm64/configs -name "*vermeer*" | grep "defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          [ -z "$DEFCONFIG" ] && DEFCONFIG="gki_defconfig"
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 $DEFCONFIG

          # --- ВКЛЮЧАЕМ ФУНКЦИИ ---
          scripts/config -e KSU
          scripts/config -e KSU_SUSFS
          scripts/config -e KSU_SUSFS_SUS_PATH
          scripts/config -e KSU_SUSFS_SUS_MOUNT
          scripts/config -e KSU_SUSFS_SPOOF_UNAME
          scripts/config -e TCP_CONG_BBR
          scripts/config -e DEFAULT_BBR
          scripts/config -e NET_SCH_FQ_CODEL
          scripts/config -e HZ_1000
          scripts/config --set-val HZ 1000
          scripts/config -e ZRAM
          scripts/config -e CRYPTO_ZSTD
          scripts/config -e ZRAM_DEF_COMP_ZSTD
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 9. Компиляция Ядра (Vermeer)
        run: |
          make -j$(nproc --all) ARCH=arm64 LLVM=1 LLVM_IAS=1

      - name: 10. Упаковка в AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Ultimate-Gadzhi-Kernel-F6Pro/g' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=vermeer/g' anykernel.sh
          
          if [ -f "../arch/arm64/boot/Image" ]; then
            cp "../arch/arm64/boot/Image" ./
          elif [ -f "../arch/arm64/boot/Image.gz" ]; then
            cp "../arch/arm64/boot/Image.gz" ./
          fi
          
          zip -r9 ../Ultimate-Gadzhi-Kernel-F6Pro.zip *

      - name: 11. Загрузка готового ядра
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Gadzhi-Kernel-F6Pro
          path: Ultimate-Gadzhi-Kernel-F6Pro.zip
