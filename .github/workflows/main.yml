name: Сборка ULTIMATE Vermeer (Audited & Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    name: Компиляция (SM8550 / Vermeer)
    runs-on: ubuntu-22.04 # Требование для Clang-17 и GLIBC
    steps:
      - name: 1. Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git gnupg gperf libssl-dev libxml2-utils zip zstd python3 dwarves libelf-dev pahole
          echo "✅ Окружение готово"

      - name: 2. Загрузка исходников (Correct Branch)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-vermeer-t-oss # Исправленная ветка
          fetch-depth: 1

      - name: 3. Кэшируемый Clang 17.0.6
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: clang-17-0-6-vermeer
          
      - name: 4. Установка Clang
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/clang/bin" ]; then
            mkdir -p $GITHUB_WORKSPACE/clang
            cd $GITHUB_WORKSPACE/clang
            curl -LO https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
            tar -xJf *.tar.xz --strip-components=1
          fi
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 5. Интеграция ReSukiSU
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp
          mkdir -p drivers/kernelsu
          cp -af ksutmp/kernel/. drivers/kernelsu/
          sed -i '/git/,+4d' drivers/kernelsu/Kbuild # Фикс 5 строк проверки
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig # Фикс места вставки
          echo "KSU_SRC_PATH=$(pwd)/drivers/kernelsu" >> $GITHUB_ENV

      - name: 6. Интеграция SUSFS (Correct Order)
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_patches
          # ПРАВИЛЬНЫЙ ПОРЯДОК: Сначала патч, потом копирование
          patch -p1 < susfs_patches/kernel_patches/50_add_susfs_in_gki_android13_5.15.patch || true
          cp -r susfs_patches/kernel_patches/fs/* ./fs/
          cp -r susfs_patches/kernel_patches/include/linux/* ./include/linux/
          cd drivers/kernelsu && patch -p1 < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true

      - name: 7. Конфигурация (Vendor Path Fix)
        run: |
          # Поиск в vendor/ для ветки bsp
          DEFCONFIG=$(find arch/arm64/configs -name "vermeer_defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/kalama_defconfig" # Fallback на платформу kalama
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 $DEFCONFIG
          scripts/config -e KSU -e KSU_SUSFS -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_SPOOF_CMDLINE
          scripts/config -e CONFIG_KALLSYMS_ALL -e CONFIG_KPROBES -e CONFIG_DEBUG_INFO_BTF
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 8. Компиляция
        run: |
          make -j$(nproc --all) \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSU_SRC=$KSU_SRC_PATH

      - name: 9. AnyKernel3 (Image.gz Only Fix)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=vermeer/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/init_boot|' anykernel.sh # Цель init_boot
          
          # Копируем только Image.gz, чтобы влезть в 32МБ
          cp ../arch/arm64/boot/Image.gz ./
          # Поиск DTB kalama в vendor
          find ../arch/arm64/boot/dts/vendor/qcom -name "*kalama*.dtb" -exec cp {} ./dtb \;
          zip -r9 ../Gadzhi-Vermeer-Final.zip *

      - name: 10. Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gadzhi-Vermeer-Final
          path: Gadzhi-Vermeer-Final.zip
          
