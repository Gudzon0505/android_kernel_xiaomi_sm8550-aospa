name: AOSPA Kernel Reconnaissance (SM8550)

on:
  workflow_dispatch:

jobs:
  recon:
    name: Разведка дерева AOSPA
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Загрузка исходников
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Поиск сборочных скриптов (Build Scripts)
        run: |
          echo "🔍 Ищу скрипты сборки в корне..."
          find . -maxdepth 2 -name "*.sh" -type f
          echo "-----------------------------------"
          
      - name: 3. Поиск всех Defconfig для arm64
        run: |
          echo "🔍 Ищу дефконфиги для Snapdragon 8 Gen 2..."
          find arch/arm64/configs -type f | grep -iE 'vermeer|kalama|sm8550|aospa|gki'
          echo "-----------------------------------"

      - name: 4. Проверка Makefile
        run: |
          echo "🔍 Версия ядра и архитектура..."
          head -n 5 Makefile
          echo "-----------------------------------"
