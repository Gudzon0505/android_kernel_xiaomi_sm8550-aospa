name: ULTIMATE Vermeer Kernel (Lunaris 3.10)

on:
  workflow_dispatch:

jobs:
  build:
    name: SM8550 / Vermeer / POCO F6 Pro
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git gnupg gperf libssl-dev libxml2-utils zip zstd python3 dwarves libelf-dev ccache rsync device-tree-compiler lld llvm

      - name: 2. Загрузка исходников Xiaomi (Vermeer T-OSS)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-vermeer-t-oss
          fetch-depth: 1
          path: kernel

      - name: 3. Установка Clang 17.0.6 (Lunaris Match)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -LO https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf *.tar.xz --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 4. Интеграция ReSukiSU + SUSFS (Правильный порядок)
        working-directory: kernel
        run: |
          # KernelSU
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp
          mkdir -p drivers/kernelsu
          cp -af ksutmp/kernel/. drivers/kernelsu/
          sed -i '/git/,+4d' drivers/kernelsu/Kbuild
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # SUSFS (Патч -> Копирование)
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_patches
          patch -p1 < susfs_patches/kernel_patches/50_add_susfs_in_*.patch || true
          cp -r susfs_patches/kernel_patches/fs/* ./fs/
          cp -r susfs_patches/kernel_patches/include/linux/* ./include/linux/
          cd drivers/kernelsu && patch -p1 < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
          echo "KSU_SRC_PATH=$(pwd)/drivers/kernelsu" >> $GITHUB_ENV

      - name: 5. ХИРУРГИЧЕСКИЙ ФИКС Xiaomi (Удаление битых ссылок)
        working-directory: kernel
        run: |
          # Жесткое удаление битой ссылки hwid/Kconfig
          sed -i '/hwid\/Kconfig/d' drivers/misc/Kconfig
          # Зачистка дублей и правильное подключение SUSFS
          sed -i '/susfs/d' fs/Kconfig
          echo 'source "fs/susfs/Kconfig"' >> fs/Kconfig
          echo "✅ Битые ссылки MiCode зачищены."

      - name: 6. Поиск и настройка Defconfig
        id: cfg
        working-directory: kernel
        run: |
          CONF_PATH=$(find arch/arm64/configs -name "*vermeer*defconfig*" | head -n 1)
          [ -z "$CONF_PATH" ] && CONF_PATH=$(find arch/arm64/configs -name "*kalama*defconfig*" | head -n 1)
          DEFCONFIG=$(echo "$CONF_PATH" | sed 's|arch/arm64/configs/||')
          echo "🚀 Нашёлся конфиг: $DEFCONFIG"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_OUTPUT

      - name: 7. Генерация .config (С флагами маскировки)
        working-directory: kernel
        run: |
          DEFCONFIG="${{ steps.cfg.outputs.DEFCONFIG }}"
          # Создаем базовый конфиг в папке out/
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          # Внедряем KSU, SUSFS и Spoofing
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_SPOOF_CMDLINE -e CONFIG_DEBUG_INFO_BTF -e KALLSYMS_ALL -e KPROBES
          # Применяем изменения
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 8. КОМПИЛЯЦИЯ ЯДРА
        working-directory: kernel
        run: |
          # ВАЖНО: O=out гарантирует сборку из нашего модифицированного конфига
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="clang" LD="ld.lld" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KSU_SRC=$KSU_SRC_PATH

      - name: 9. Упаковка в AnyKernel3 (init_boot + Конкатенация DTB)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          sed -i "s/device.name1=.*/device.name1=vermeer/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/init_boot|' anykernel.sh
          
          # Копируем само ядро
          cp ../kernel/out/arch/arm64/boot/Image.gz ./
          
          # Склеиваем все драйверы дисплея в один файл dtb
          if [ -d "../kernel/out/arch/arm64/boot/dts/vendor/qcom" ]; then
            DTB_FILES=$(find ../kernel/out/arch/arm64/boot/dts/vendor/qcom -name "*kalama*.dtb" -o -name "*vermeer*.dtb")
            if [ -n "$DTB_FILES" ]; then
              cat $DTB_FILES > ./dtb
              echo "✅ Дисплейные драйверы (DTB) склеены и упакованы."
            fi
          fi
          
          zip -r9 ../Gadzhi-Vermeer-Lunaris.zip *

      - name: 10. Загрузка Артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Gadzhi-Vermeer-Lunaris
          path: Gadzhi-Vermeer-Lunaris.zip
