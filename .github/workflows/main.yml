name: Build Kernel - POCO F6 Pro (Vermeer) для Lunaris 3.10

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Ветка MiCode (auto = автопоиск)'
        required: true
        default: 'auto'
      susfs_branch:
        description: 'Ветка SUSFS (auto = автопоиск под версию ядра)'
        required: true
        default: 'auto'
      android_version:
        description: 'Версия Android (для автопоиска): 13, 14, 15'
        required: true
        default: '14'

jobs:
  build:
    name: Compile (SM8550 / Vermeer / POCO F6 Pro)
    runs-on: ubuntu-22.04
    env:
      KBUILD_BUILD_USER: "gadzhi"
      KBUILD_BUILD_HOST: "github-actions"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "5G"

    steps:
      # ───────────────────────────────────────────────
      - name: 1. Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git gnupg gperf \
            libssl-dev libxml2-utils zip zstd python3 \
            dwarves libelf-dev ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler

      # ───────────────────────────────────────────────
      - name: 2. Диагностика доступных веток MiCode
        run: |
          echo "════════════════════════════════════════════"
          echo "📋 ВСЕ ВЕТКИ С 'vermeer':"
          echo "════════════════════════════════════════════"
          git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            | grep -i vermeer | awk '{print $2}' | sed 's|refs/heads/||' || echo "Не найдено"
          
          echo ""
          echo "════════════════════════════════════════════"
          echo "📋 ВСЕ ВЕТКИ С 'kalama':"
          echo "════════════════════════════════════════════"
          git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            | grep -i kalama | awk '{print $2}' | sed 's|refs/heads/||' || echo "Не найдено"

      # ───────────────────────────────────────────────
      - name: 3. Автопоиск рабочей ветки
        id: find_branch
        run: |
          set -e
          
          ANDROID_VER="${{ github.event.inputs.android_version }}"
          MANUAL_BRANCH="${{ github.event.inputs.branch }}"
          REPO="https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
          
          # Соответствие версии Android → буква
          case "$ANDROID_VER" in
            13) LETTER="t" ;;
            14) LETTER="u" ;;
            15) LETTER="v" ;;
            *)  LETTER="u" ;;
          esac
          
          if [ "$MANUAL_BRANCH" != "auto" ]; then
            echo "🎯 Используем ручную ветку: $MANUAL_BRANCH"
            FOUND_BRANCH="$MANUAL_BRANCH"
          else
            # Список кандидатов в порядке приоритета
            CANDIDATES=(
              "vermeer-${LETTER}-oss"
              "bsp-vermeer-${LETTER}-oss"
              "kalama-${LETTER}-oss"
              "bsp-kalama-${LETTER}-oss"
              "vermeer-${LETTER}-q-oss"
              "bsp-vermeer-${LETTER}-q-oss"
            )
            
            FOUND_BRANCH=""
            for branch in "${CANDIDATES[@]}"; do
              echo "🔍 Проверяю: $branch"
              if git ls-remote --exit-code --heads "$REPO" "$branch" >/dev/null 2>&1; then
                echo "✅ Найдена ветка: $branch"
                FOUND_BRANCH="$branch"
                break
              fi
            done
            
            if [ -z "$FOUND_BRANCH" ]; then
              echo "❌ Ни одна из стандартных веток не найдена!"
              echo "Доступные vermeer-ветки:"
              git ls-remote --heads "$REPO" | grep -i vermeer | awk '{print $2}' | sed 's|refs/heads/||'
              echo ""
              echo "💡 Запусти workflow снова, указав ветку вручную в поле 'branch'"
              exit 1
            fi
          fi
          
          echo "BRANCH=$FOUND_BRANCH" >> $GITHUB_OUTPUT
          echo "ANDROID_LETTER=$LETTER" >> $GITHUB_OUTPUT

      # ───────────────────────────────────────────────
      - name: 4. Клонирование исходников ядра
        run: |
          set -e
          BRANCH="${{ steps.find_branch.outputs.BRANCH }}"
          echo "📥 Клонирую ветку: $BRANCH"
          
          git clone --depth=1 \
            --branch "$BRANCH" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            kernel
          
          cd kernel
          echo "✅ Клонирование завершено"
          echo "=== Версия ядра ==="
          head -5 Makefile

      # ───────────────────────────────────────────────
      - name: 5. Определение версии ядра и автоподбор SUSFS ветки
        id: detect_kernel
        working-directory: kernel
        run: |
          VERSION=$(grep -E "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -E "^PATCHLEVEL = " Makefile | awk '{print $3}')
          KERNEL_VER="${VERSION}.${PATCHLEVEL}"
          echo "🔧 Версия ядра: $KERNEL_VER"
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_OUTPUT
          
          SUSFS_INPUT="${{ github.event.inputs.susfs_branch }}"
          LETTER="${{ steps.find_branch.outputs.ANDROID_LETTER }}"
          ANDROID_VER="${{ github.event.inputs.android_version }}"
          
          if [ "$SUSFS_INPUT" != "auto" ]; then
            SUSFS_BRANCH="$SUSFS_INPUT"
          else
            SUSFS_BRANCH="gki-android${ANDROID_VER}-${KERNEL_VER}"
          fi
          
          echo "🎯 SUSFS ветка: $SUSFS_BRANCH"
          
          # Проверка существования ветки SUSFS
          if ! git ls-remote --exit-code --heads \
               https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_BRANCH" >/dev/null 2>&1; then
            echo "⚠️ Ветка $SUSFS_BRANCH не найдена. Доступные:"
            git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git \
              | awk '{print $2}' | sed 's|refs/heads/||'
            exit 1
          fi
          
          echo "SUSFS_BRANCH=$SUSFS_BRANCH" >> $GITHUB_OUTPUT

      # ───────────────────────────────────────────────
      - name: 6. Проверка структуры репозитория
        working-directory: kernel
        run: |
          echo "=== Все defconfig'и ==="
          find arch/arm64/configs -type f | sort
          echo ""
          echo "=== Структура drivers/ ==="
          ls drivers/ | head -30

      # ───────────────────────────────────────────────
      - name: 7. Кэширование Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-17.0.6-ubuntu22

      - name: 8. Установка Clang 17.0.6
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -L -o clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang.tar.xz --strip-components=1
          rm clang.tar.xz

      - name: 9. Добавление Clang в PATH
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/clang/bin/clang --version

      # ───────────────────────────────────────────────
      - name: 10. ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-vermeer-${{ github.run_id }}
          restore-keys: |
            ccache-vermeer-

      # ───────────────────────────────────────────────
      - name: 11. Интеграция ReSukiSU (KernelSU)
        working-directory: kernel
        run: |
          set -e
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ../ksutmp
          
          if [ ! -d ../ksutmp/kernel ]; then
            echo "❌ ReSukiSU: папка kernel не найдена!"
            ls ../ksutmp
            exit 1
          fi
          
          mkdir -p drivers/kernelsu
          cp -af ../ksutmp/kernel/. drivers/kernelsu/
          
          if [ -f drivers/kernelsu/Kbuild ]; then
            sed -i '/git/,+4d' drivers/kernelsu/Kbuild || true
          fi
          
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          
          echo "KSU_SRC_PATH=$(pwd)/drivers/kernelsu" >> $GITHUB_ENV
          echo "✅ KernelSU интегрирован"

      # ───────────────────────────────────────────────
      - name: 12. Применение SUSFS патчей
        working-directory: kernel
        run: |
          set -e
          SUSFS_BRANCH="${{ steps.detect_kernel.outputs.SUSFS_BRANCH }}"
          
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b "$SUSFS_BRANCH" \
            ../susfs_patches
          
          PATCH=$(ls ../susfs_patches/kernel_patches/50_add_susfs_in_*.patch 2>/dev/null | head -1)
          if [ -z "$PATCH" ]; then
            echo "❌ SUSFS патч не найден!"
            ls ../susfs_patches/kernel_patches/
            exit 1
          fi
          
          echo "📦 Применяем: $PATCH"
          if ! patch -p1 < "$PATCH"; then
            echo "⚠️ Часть SUSFS патча не применилась — .rej файлы:"
            find . -name "*.rej" 2>/dev/null
          fi
          
          cp -r ../susfs_patches/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          cp -r ../susfs_patches/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          
          KSU_PATCH="../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            cd drivers/kernelsu
            patch -p1 < "../../$KSU_PATCH" || echo "⚠️ KSU SUSFS patch неполный"
            cd ../..
          fi
          
          if [ -d fs/susfs ] || [ -f fs/susfs.c ]; then
            echo "✅ SUSFS файлы на месте"
          else
            echo "⚠️ SUSFS файлы не найдены — проверь структуру"
            ls fs/ | grep -i sus || true
          fi

      # ───────────────────────────────────────────────
      - name: 13. Автофикс битых ссылок Kconfig
        working-directory: kernel
        run: |
          set -e
          
          fix_kconfig() {
            local file=$1
            [ ! -f "$file" ] && return
            grep -nP '^\s*source\s+"' "$file" 2>/dev/null | while IFS=: read -r line _; do
              path=$(sed -n "${line}p" "$file" | grep -oP 'source\s+"\K[^"]+')
              [ -z "$path" ] && continue
              if echo "$path" | grep -q '\$'; then continue; fi
              if [ ! -f "$path" ]; then
                echo "❌ Битая ссылка $file:$line → $path"
                sed -i "${line}s|^|# BROKEN: |" "$file"
              fi
            done
          }
          
          fix_kconfig drivers/misc/Kconfig
          fix_kconfig drivers/Kconfig
          
          if [ -f fs/susfs/Kconfig ] && ! grep -q "susfs/Kconfig" fs/Kconfig; then
            echo 'source "fs/susfs/Kconfig"' >> fs/Kconfig
          fi
          
          echo "✅ Kconfig обработан"

      # ───────────────────────────────────────────────
      - name: 14. Конфигурация ядра
        working-directory: kernel
        run: |
          set -e
          
          CONF_PATH=$(find arch/arm64/configs -name "vermeer_defconfig" 2>/dev/null | head -1)
          [ -z "$CONF_PATH" ] && CONF_PATH=$(find arch/arm64/configs -name "*vermeer*" -type f 2>/dev/null | head -1)
          [ -z "$CONF_PATH" ] && CONF_PATH=$(find arch/arm64/configs -name "kalama_GKI.config" 2>/dev/null | head -1)
          [ -z "$CONF_PATH" ] && CONF_PATH=$(find arch/arm64/configs -name "*kalama*defconfig*" 2>/dev/null | head -1)
          
          if [ -z "$CONF_PATH" ]; then
            echo "❌ Defconfig не найден!"
            find arch/arm64/configs -type f
            exit 1
          fi
          
          DEFCONFIG=$(basename "$CONF_PATH")
          REL_PATH=${CONF_PATH#arch/arm64/configs/}
          echo "🚀 Используем: $REL_PATH"
          
          if [ "$REL_PATH" != "$DEFCONFIG" ]; then
            cp "$CONF_PATH" "arch/arm64/configs/$DEFCONFIG"
          fi
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out $DEFCONFIG
          
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_ENABLE_LOG \
            -e DEBUG_INFO_BTF \
            -d LTO_CLANG_FULL \
            -e LTO_CLANG_THIN
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out olddefconfig
          
          echo "=== KSU/SUSFS финальные настройки ==="
          grep -E "KSU|SUSFS" out/.config || true

      # ───────────────────────────────────────────────
      - name: 15. Компиляция ядра
        working-directory: kernel
        run: |
          set -e
          export PATH="/usr/lib/ccache:$PATH"
          
          make -j$(nproc --all) \
            ARCH=arm64 \
            O=out \
            LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KSU_SRC=$KSU_SRC_PATH \
            2>&1 | tee build.log
          
          echo ""
          echo "=== Артефакты ==="
          ls -la out/arch/arm64/boot/ || true

      # ───────────────────────────────────────────────
      - name: 16. Сборка AnyKernel3 ZIP
        working-directory: kernel
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ../AnyKernel3
          cd ../AnyKernel3
          
          sed -i 's|kernel.string=.*|kernel.string=Gadzhi-Vermeer для POCO F6 Pro|' anykernel.sh
          sed -i 's|do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=vermeer|' anykernel.sh
          sed -i 's|device.name2=.*|device.name2=Vermeer|' anykernel.sh
          sed -i 's|device.name3=.*|device.name3=POCO F6 Pro|' anykernel.sh
          sed -i 's|device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|supported.versions=.*|supported.versions=|' anykernel.sh
          sed -i 's|is_slot_device=.*|is_slot_device=1|' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/init_boot|' anykernel.sh
          
          if [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            cp ../kernel/out/arch/arm64/boot/Image ./
            echo "✅ Image скопирован"
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz ./
            echo "⚠️ Image.gz (Image не найден)"
          else
            echo "❌ Ядро не собрано!"
            ls ../kernel/out/arch/arm64/boot/
            exit 1
          fi
          
          DTB_DIR=../kernel/out/arch/arm64/boot/dts/vendor/qcom
          if [ -d "$DTB_DIR" ]; then
            DTBS=$(find "$DTB_DIR" -name "*kalama*.dtb" 2>/dev/null)
            if [ -n "$DTBS" ]; then
              cat $DTBS > dtb
              echo "✅ DTB склеен"
            fi
          fi
          
          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="Gadzhi-Vermeer-Lunaris-${DATE}.zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Создан: $ZIP_NAME"

      # ───────────────────────────────────────────────
      - name: 17. Загрузка ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: 18. Загрузка build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
