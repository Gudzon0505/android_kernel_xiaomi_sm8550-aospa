name: Сборка ULTIMATE Гаджи-Ядра для Poco F6 Pro

on:
  workflow_dispatch:

jobs:
  build:
    name: Компиляция пользовательского ядра Гаджи
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 1. Максимальная очистка пространства
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /usr/local/ios /usr/local/bin/aliyun
          sudo apt-get clean
          echo "✅ Диск подготовлен"

      - name: 2. Загрузка исходников ядра
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 3. Установка системных зависимостей (Ubuntu 24.04 Noble)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib git gnupg gperf \
            liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-dev dwarves libelf-dev zstd pahole pkg-config make
          echo "✅ Окружение готово"

      - name: 4. Кэш Neutron Clang и ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/clang
            ${{ github.workspace }}/.ccache
          key: build-assets-${{ runner.os }}-v1

      - name: 5. Установка тулчейна (Neutron Clang)
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/clang/bin" ]; then
            mkdir -p $GITHUB_WORKSPACE/clang
            cd $GITHUB_WORKSPACE/clang
            curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S
          fi
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "✅ Тулчейн верифицирован"

      - name: 6. Настройка ccache
        run: |
          mkdir -p $GITHUB_WORKSPACE/.ccache
          ccache -M 5G
          ccache --set-config=cache_dir=$GITHUB_WORKSPACE/.ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV

      - name: 7. Загрузка ReSukiSU
        uses: actions/checkout@v4
        with:
          repository: ReSukiSU/ReSukiSU
          path: ksutmp
          fetch-depth: 1

      - name: 8. Интеграция ReSukiSU (Bypass Submodule Check)
        run: |
          mkdir -p drivers/kernelsu
          cp -af ksutmp/kernel/. drivers/kernelsu/
          if ! grep -q "kernelsu" drivers/Makefile; then echo "obj-y += kernelsu/" >> drivers/Makefile; fi
          if ! grep -q "kernelsu" drivers/Kconfig; then sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig; fi
          echo "KSU_SRC_PATH=$(pwd)/drivers/kernelsu" >> $GITHUB_ENV
          echo "✅ ReSukiSU вшит в систему"

      - name: 9. Интеграция патчей SUSFS v2.10
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_patches
          cp -r susfs_patches/kernel_patches/fs/* ./fs/
          cp -r susfs_patches/kernel_patches/include/linux/* ./include/linux/
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch | head -n 1)
          [ -f "$SUSFS_PATCH" ] && patch -p1 --forward < "$SUSFS_PATCH" || echo "Skip"
          cd drivers/kernelsu && patch -p1 --forward < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || echo "Skip"
          cd ../..

      - name: 10. Конфигурация МЕГА-ФИШЕК (vermeer)
        run: |
          chmod +x scripts/config || true
          DEFCONFIG=$(find arch/arm64/configs -name "*vermeer*" -name "*defconfig*" | head -n 1 | sed 's|arch/arm64/configs/||')
          make ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 $DEFCONFIG
          scripts/config -e KSU -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SPOOF_UNAME
          scripts/config -e TCP_CONG_BBR --set-str DEFAULT_TCP_CONG bbr -e NET_SCH_FQ_CODEL
          scripts/config -e LRU_GEN -e LRU_GEN_ENABLED -e ZRAM -e CRYPTO_ZSTD -e ZRAM_DEF_COMP_ZSTD
          scripts/config -e PREEMPT_DYNAMIC -e NO_HZ_IDLE -e HIGH_RES_TIMERS -e MQ_IOSCHED_KYBER -e CONFIG_KALLSYMS_ALL -e CONFIG_KPROBES
          make ARCH=arm64 CC="ccache clang" LLVM=1 LLVM_IAS=1 olddefconfig
          echo "✅ Конфигурация завершена"

      - name: 11. Компиляция Ядра (Final Battle)
        run: |
          make -j$(nproc --all) \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KSU_SRC=$KSU_SRC_PATH \
            2>&1 | tee build.log

      - name: 12. Упаковка в AnyKernel3 (A/B)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          sed -i "s/kernel.string=.*/kernel.string=Ultimate-Gadzhi-Kernel-F6Pro-${BUILD_DATE}/" anykernel.sh
          sed -i "s/device.name1=.*/device.name1=vermeer/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          [ -f "../arch/arm64/boot/Image" ] && cp "../arch/arm64/boot/Image" ./
          [ -f "../arch/arm64/boot/Image.gz" ] && cp "../arch/arm64/boot/Image.gz" ./
          [ -f "../arch/arm64/boot/dtbo.img" ] && cp "../arch/arm64/boot/dtbo.img" ./
          zip -r9 ../Ultimate-Gadzhi-Kernel-F6Pro-${BUILD_DATE}.zip *

      - name: 13. Загрузка готового ядра
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Gadzhi-Kernel-F6Pro
          path: Ultimate-Gadzhi-Kernel-F6Pro-*.zip
          retention-days: 30
