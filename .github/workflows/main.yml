name: MONOLITH v27 (DeniNister Modular Style)

on:
  workflow_dispatch:

# ═══════════════════════════════════════════════════════════
# КОНФИГУРАЦИЯ (В стиле JSON DeniNister)
# ═══════════════════════════════════════════════════════════
env:
  KERNEL_REPO: MiCode/Xiaomi_Kernel_OpenSource
  KERNEL_BRANCH: bsp-vermeer-t-oss
  DEVICE: vermeer
  DEFCONFIG: vermeer_defconfig
  CLANG_VERSION: 17.0.6
  KSU_VERSION: 11950
  CCACHE_SIZE: 10G
  # Параметры SukiSU / SUSFS
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  SUSFS_BRANCH: gki-android13-5.15

jobs:
  build:
    name: Build Kernel (${{ env.DEVICE }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # --- ИНФРАСТРУКТУРА ---
      - name: 1. Инициализация окружения
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex git gnupg gperf libssl-dev \
            libxml2-utils zip zstd python3 python3-dev dwarves libelf-dev ccache \
            rsync pahole device-tree-compiler lld llvm gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          echo "✅ Окружение готово"

      - name: 2. Кэширование тулчейна и ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/clang
            ${{ github.workspace }}/.ccache
          key: ${{ env.DEVICE }}-build-v27-${{ github.sha }}
          restore-keys: ${{ env.DEVICE }}-build-v27-

      - name: 3. Установка Clang ${{ env.CLANG_VERSION }}
        run: |
          if [ ! -d "${{ github.workspace }}/clang" ]; then
            mkdir -p ${{ github.workspace }}/clang
            curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/clang+llvm-${{ env.CLANG_VERSION }}-x86_64-linux-gnu-ubuntu-22.04.tar.xz | tar -xJf - -C ${{ github.workspace }}/clang --strip-components=1
          fi
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      # --- ИСХОДНИКИ И МОДУЛЬНЫЕ ПАТЧИ ---
      - name: 4. Загрузка MiCode
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: 5. [МОДУЛЬ] Интеграция ReSukiSU
        working-directory: kernel
        run: |
          git clone --depth=1 ${{ env.RESUKISU_REPO }} ksutmp
          mkdir -p drivers/kernelsu
          cp -a ksutmp/kernel/. drivers/kernelsu/
          
          # Наш "Иллюзорный" хак (Gemini) для обхода защиты ReSukiSU
          sed -i 's/ifneq ($(shell cd $(KSU_SRC); git rev-parse --is-inside-work-tree 2>\/dev\/null),true)/ifneq (true,true)/g' drivers/kernelsu/Kbuild
          
          # Подключение к дереву
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "✅ ReSukiSU интегрирован"

      - name: 6. [МОДУЛЬ] Интеграция SUSFS v2.10
        working-directory: kernel
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ env.SUSFS_BRANCH }} susfs_patches
          
          # Порядок Claude: сначала патч ядра, потом файлы
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch | head -n 1)
          patch -p1 --forward < "$SUSFS_PATCH" || true
          
          cp -a susfs_patches/kernel_patches/fs/. fs/
          cp -a susfs_patches/kernel_patches/include/linux/. include/linux/
          
          # Патч для KSU
          cd drivers/kernelsu && patch -p1 --forward < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
          echo "✅ SUSFS v2.10 интегрирован"

      - name: 7. [МОДУЛЬ] Исправление Xiaomi (MiCode Fix)
        working-directory: kernel
        run: |
          # Создаем элитную заглушку (DeepSeek Fix)
          mkdir -p drivers/xiaomi
          cat > drivers/xiaomi/dummy.c << 'EOF'
          #include <linux/module.h>
          #include <linux/init.h>
          static int __init xiaomi_dummy_init(void) { return 0; }
          module_init(xiaomi_dummy_init);
          MODULE_LICENSE("GPL");
          EOF
          echo "obj-y += dummy.o" > drivers/xiaomi/Makefile
          
          # Чистим битые пути в Kconfig
          sed -i '/hwid\/Kconfig/d' drivers/misc/Kconfig || true
          echo "✅ Драйверы Xiaomi исправлены"

      # --- СБОРКА ---
      - name: 8. Конфигурация и Компиляция
        working-directory: kernel
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          ccache --set-config=max_size=${{ env.CCACHE_SIZE }}
          ccache -z

          # Поиск конфига в стиле DeniNister
          CONF_PATH=$(find arch/arm64/configs -name "${{ env.DEFCONFIG }}" -o -name "kalama_defconfig" | head -n 1)
          FINAL_DEF=$(echo $CONF_PATH | sed 's|arch/arm64/configs/||')
          
          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KSU_VERSION=${{ env.KSU_VERSION }} \
                     CC='ccache clang' CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KSU_SRC=$(pwd)/drivers/kernelsu"

          make $MAKE_ARGS $FINAL_DEF
          
          # Опции маскировки
          ./scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_SPOOF_CMDLINE \
            -e TCP_CONG_BBR --set-str DEFAULT_TCP_CONG bbr -e DEBUG_INFO_BTF -e KALLSYMS_ALL || true
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS 2>&1 | tee ../build.log
          ccache -s

      # --- УПАКОВКА ---
      - name: 9. Сборка AnyKernel3 (GKI 2.0)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE }}/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          sed -i 's|^block=.*|block=auto;|' anykernel.sh # Умная прошивка (Gemini)
          
          # Выбор ядра
          [ -f ../kernel/out/arch/arm64/boot/Image.gz ] && cp ../kernel/out/arch/arm64/boot/Image.gz ./ || cp ../kernel/out/arch/arm64/boot/Image ./
          
          zip -r9 ../Monolith-DeniStyle-${{ env.DEVICE }}.zip * -x .git README.md

      - name: 10. Выдача результата
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Vermeer-v27
          path: Monolith-DeniStyle-${{ env.DEVICE }}.zip
          retention-days: 7
