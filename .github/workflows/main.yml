name: ULTIMATE HYBRID — Gadzhi Kernel / Poco F6 Pro (Vermeer)

on:
  workflow_dispatch:

jobs:
  build:
    name: SM8550 / POCO F6 Pro / Vermeer
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ═══════════════════════════════════════════════════════════
      # ШАГ 1 — Очистка диска
      # ═══════════════════════════════════════════════════════════
      - name: 1. Очистка диска
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
          echo "✅ Диск очищен"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 2 — Зависимости (добавлен ccache)
      # ═══════════════════════════════════════════════════════════
      - name: 2. Системные зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl flex \
            git gnupg gperf libssl-dev libxml2-utils \
            zip zstd python3 python3-dev dwarves \
            libelf-dev ccache rsync pahole \
            device-tree-compiler lld llvm \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi
          which ccache || { echo "❌ ccache не установлен"; exit 1; }
          echo "✅ Зависимости установлены"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 3 — Кэш LLVM 17.0.6
      # ═══════════════════════════════════════════════════════════
      - name: 3. Кэш LLVM 17.0.6
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: llvm-17.0.6-ubuntu22-v1

      - name: Установка LLVM 17.0.6 (если нет кэша)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -L --retry 3 --retry-delay 5 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz \
            -o clang.tar.xz
          tar -xJf clang.tar.xz --strip-components=1
          rm clang.tar.xz
          echo "✅ LLVM 17.0.6 установлен"

      - name: Регистрация тулчейна в PATH
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          ls $GITHUB_WORKSPACE/clang/bin | head -10

      # ═══════════════════════════════════════════════════════════
      # ШАГ 4 — Проверка тулчейна (расширен список)
      # ═══════════════════════════════════════════════════════════
      - name: 4. Проверка тулчейна
        run: |
          clang --version          || { echo "❌ clang не найден!";              exit 1; }
          ld.lld --version         || { echo "❌ ld.lld не найден!";             exit 1; }
          llvm-ar --version        || { echo "❌ llvm-ar не найден!";            exit 1; }
          llvm-objcopy --version   || { echo "❌ llvm-objcopy не найден!";       exit 1; }
          llvm-strip --version     || { echo "❌ llvm-strip не найден!";         exit 1; }
          aarch64-linux-gnu-gcc --version || { echo "❌ cross-compiler не найден!"; exit 1; }
          echo "✅ Тулчейн готов"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 5 — Настройка ccache
      # ═══════════════════════════════════════════════════════════
      - name: 5. Настройка ccache
        run: |
          mkdir -p $GITHUB_WORKSPACE/.ccache
          ccache --set-config=cache_dir=$GITHUB_WORKSPACE/.ccache
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache -z
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
          echo "✅ ccache настроен"

      - name: Кэш ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-vermeer-${{ github.sha }}
          restore-keys: ccache-vermeer-

      # ═══════════════════════════════════════════════════════════
      # ШАГ 6 — Переменные окружения
      # ═══════════════════════════════════════════════════════════
      - name: 6. Переменные окружения
        run: |
          echo "ARCH=arm64"                               >> $GITHUB_ENV
          echo "SUBARCH=arm64"                            >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Gadzhi"                 >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=GitHub_Actions"         >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"         >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-"        >> $GITHUB_ENV
          echo "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "LD=ld.lld"                                >> $GITHUB_ENV
          echo "KSU_VERSION=11950"                        >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════════════
      # ШАГ 7 — Исходники ядра MiCode
      # ═══════════════════════════════════════════════════════════
      - name: 7. Загрузка исходников (MiCode Vermeer OSS)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-vermeer-t-oss
          fetch-depth: 1
          path: kernel

      # ═══════════════════════════════════════════════════════════
      # ШАГ 8 — Фикс сломанных Xiaomi драйверов
      # ═══════════════════════════════════════════════════════════
      - name: 8. Фикс сломанных Xiaomi драйверов
        working-directory: kernel
        run: |
          mkdir -p drivers/xiaomi
          cat > drivers/xiaomi/dummy.c << 'EOF'
          #include <linux/module.h>
          #include <linux/init.h>

          static int __init xiaomi_dummy_init(void) { return 0; }
          module_init(xiaomi_dummy_init);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("Xiaomi dummy driver");
          EOF
          echo "obj-y += dummy.o" >> drivers/xiaomi/Makefile
          sed -i '/hwid\/Kconfig/d'       drivers/misc/Kconfig   || true
          sed -i '/xiaomi\/Kconfig/d'     drivers/misc/Kconfig   || true
          echo "✅ Xiaomi заглушки созданы"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 9 — Интеграция ReSukiSU
      # ═══════════════════════════════════════════════════════════
      - name: 9. Интеграция ReSukiSU
        working-directory: kernel
        run: |
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp \
            || { echo "❌ Не удалось клонировать ReSukiSU"; exit 1; }

          if [ ! -d "ksutmp/kernel" ]; then
            echo "❌ Папка ksutmp/kernel не найдена!"
            ls -la ksutmp/
            exit 1
          fi

          mkdir -p drivers/kernelsu
          cp -a ksutmp/kernel/* drivers/kernelsu/ 2>/dev/null || true
          cp -a ksutmp/kernel/.??* drivers/kernelsu/ 2>/dev/null || true
          rm -rf drivers/kernelsu/.git 2>/dev/null || true

          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "❌ Kconfig не скопировался!"
            ls -la drivers/kernelsu/
            exit 1
          fi

          if [ -f "drivers/kernelsu/Kbuild" ]; then
            sed -i 's/ifneq ($(shell cd $(KSU_SRC); git rev-parse --is-inside-work-tree 2>\/dev\/null),true)/ifneq (true,true)/g' \
              drivers/kernelsu/Kbuild
            echo "✅ Git submodule хак применён"
          fi

          grep -q "kernelsu" drivers/Makefile || \
            echo "obj-y += kernelsu/" >> drivers/Makefile

          grep -q "kernelsu" drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "✅ ReSukiSU интегрирован"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 10 — Интеграция SUSFS (ПАТЧ KSU – из корня ядра!)
      # ═══════════════════════════════════════════════════════════
      - name: 10. Интеграция SUSFS v2.10
        working-directory: kernel
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 susfs_patches \
            || { echo "❌ Не удалось клонировать SUSFS"; exit 1; }

          # 1. Патч ядра
          SUSFS_PATCH=$(ls susfs_patches/kernel_patches/50_add_susfs_in_*.patch 2>/dev/null | head -n 1)
          if [ -f "$SUSFS_PATCH" ]; then
            patch -p1 --forward < "$SUSFS_PATCH" 2>&1 | tee /tmp/susfs.log
            if grep -q "FAILED\|can't find file\|malformed" /tmp/susfs.log; then
              echo "❌ Патч ядра упал с ошибкой!"
              cat /tmp/susfs.log
              exit 1
            fi
            echo "✅ Патч ядра наложен"
          else
            echo "⚠️ Патч ядра не найден"
          fi

          # 2. Дополнительные файлы
          cp -a susfs_patches/kernel_patches/fs/.           fs/            2>/dev/null || true
          cp -a susfs_patches/kernel_patches/include/linux/. include/linux/ 2>/dev/null || true

          # 3. Патч KernelSU — применяется ИЗ КОРНЯ ЯДРА (не cd!) для поиска файлов по путям в патче
          KSU_PATCH="susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            patch -p1 --forward < "$KSU_PATCH" 2>&1 | tee /tmp/ksu.log
            if grep -q "FAILED\|can't find file\|malformed" /tmp/ksu.log; then
              echo "❌ Патч KSU упал с ошибкой!"
              exit 1
            fi
            echo "✅ Патч KSU наложен"
          fi

      # ═══════════════════════════════════════════════════════════
      # ШАГ 11 — Конфигурация ядра
      # ═══════════════════════════════════════════════════════════
      - name: 11. Конфигурация ядра
        working-directory: kernel
        run: |
          MAKE_FLAGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KSU_VERSION=11950 \
            KSU_SRC=$(pwd)/drivers/kernelsu"

          CONF_FILE=$(find arch/arm64/configs \
            -name "vermeer_defconfig" -o \
            -name "kalama_defconfig" | head -n 1)

          if [ -z "$CONF_FILE" ]; then
            echo "❌ Дефконфиг не найден!"
            ls arch/arm64/configs/
            exit 1
          fi

          DEF=$(echo $CONF_FILE | sed 's|arch/arm64/configs/||')
          echo "✅ Используем: $DEF"

          mkdir -p out
          make $MAKE_FLAGS $DEF

          # Все опции с защитой от отсутствия (|| true)
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_SPOOF_CMDLINE || true

          ./scripts/config --file out/.config \
            -e TCP_CONG_BBR \
            --set-str DEFAULT_TCP_CONG bbr \
            -e NET_SCH_FQ_CODEL \
            -e TCP_CONG_WESTWOOD \
            -e TCP_FASTOPEN \
            -e WIREGUARD \
            -e MPTCP \
            -e NET_SCH_HTB \
            -e NET_SCH_INGRESS \
            -e NET_CLS_FLOWER \
            -e NET_ACT_POLICE \
            -e NET_FLOW_LIMIT \
            -e BPF_JIT \
            -e INET_ESP \
            -e INET_AH \
            -e XFRM_USER \
            -e L2TP \
            -e GRE \
            -e VXLAN \
            -e IPV6_ROUTER_PREF \
            -e IPV6_ROUTE_INFO \
            -e IPV6_SUBTREES \
            -e IPV6_MROUTE || true

          ./scripts/config --file out/.config \
            -e CPU_FREQ_GOV_SCHEDUTIL \
            -e SCHED_CORE \
            -e UCLAMP_TASK \
            -e CGROUP_SCHED \
            -e PSI \
            -e RCU_NOCB_CPU \
            -e IRQ_FORCED_THREADING \
            -e HIGH_RES_TIMERS \
            -e NO_HZ_IDLE \
            -e RCU_BOOST \
            -e PREEMPT_DYNAMIC || true

          ./scripts/config --file out/.config -e SCHED_WALT          || true
          ./scripts/config --file out/.config -e CPU_BOOST           || true
          ./scripts/config --file out/.config -e DYNAMIC_STUNE_BOOST || true
          ./scripts/config --file out/.config -e SCHED_CLUSTER       || true

          ./scripts/config --file out/.config \
            -e ZRAM \
            -e CRYPTO_ZSTD \
            -e ZRAM_DEF_COMP_ZSTD \
            -e LRU_GEN \
            -e LRU_GEN_ENABLED \
            -e LRU_GEN_STATS \
            -e TRANSPARENT_HUGEPAGE \
            -e ZSWAP \
            -e MEMCG \
            -e MEMCG_SWAP \
            -e KSM \
            -e ZPOOL || true

          ./scripts/config --file out/.config \
            -e MQ_IOSCHED_KYBER \
            -e MQ_IOSCHED_BFQ \
            -e BLK_WBT \
            -e BLK_CGROUP_IOLATENCY \
            -e BLK_DEV_ZONED \
            --set-str DEFAULT_IOSCHED kyber || true

          ./scripts/config --file out/.config \
            -e PM_AUTOSLEEP \
            -e PM_WAKELOCKS \
            -e ENERGY_MODEL \
            -e CPU_IDLE_GOV_TEO \
            -e SUSPEND_FREEZER \
            -e CPU_FREQ_TIMES \
            -e QCOM_RPMHPD || true

          ./scripts/config --file out/.config \
            -e F2FS_FS \
            -e FUSE_FS \
            -e OVERLAY_FS \
            -e EROFS_FS \
            -e NTFS3 \
            -e EXFAT_FS \
            -e BTRFS_FS \
            -e BLK_DEV_LOOP \
            -e BLK_DEV_RAM \
            -e DM_CRYPT \
            -e DM_VERITY || true

          ./scripts/config --file out/.config \
            -e ANDROID_BINDERFS \
            -e ANDROID_BINDER_IPC \
            -e SYNC_FILE \
            -e SW_SYNC || true

          ./scripts/config --file out/.config \
            -e NAMESPACES \
            -e PID_NS \
            -e NET_NS \
            -e UTS_NS \
            -e IPC_NS \
            -e USER_NS \
            -e TIME_NS \
            -e CGROUPS \
            -e CGROUP_BPF \
            -e KVM \
            -e KVM_ARM_HOST || true

          ./scripts/config --file out/.config \
            -e QCOM_LLCC \
            -e QCOM_RPMH \
            -e QCOM_SMEM \
            -e QCOM_AOSS_QMP \
            -e QCOM_CPUFREQ_HW \
            -e QCOM_SCM || true

          ./scripts/config --file out/.config \
            -e CRYPTO_AES_ARM64 \
            -e CRYPTO_SHA256_ARM64 \
            -e CRYPTO_CHACHA20_NEON \
            -e CRYPTO_POLY1305_NEON \
            -e CRYPTO_GCM \
            -e CRYPTO_BLAKE2B \
            -e CRYPTO_AES_CE_BLK \
            -e CRYPTO_SHA2_ARM64_CE \
            -e CRYPTO_GHASH_ARM64_CE \
            -e KERNEL_MODE_NEON \
            -e CRYPTO_SIMD \
            -e CRYPTO_LZO \
            -e CRYPTO_LZ4 \
            -e CRYPTO_LZ4HC \
            -e CRYPTO_DEFLATE || true

          ./scripts/config --file out/.config \
            -e DEBUG_INFO_BTF \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e RANDOMIZE_BASE \
            -e STRICT_KERNEL_RWX \
            -e STRICT_MODULE_RWX \
            -e INIT_ON_ALLOC_DEFAULT_ON \
            -e FORTIFY_SOURCE \
            -e STACKPROTECTOR_STRONG \
            -e SHADOW_CALL_STACK \
            -e HARDENED_USERCOPY || true

          ./scripts/config --file out/.config \
            -e BT_RFCOMM \
            -e BT_BNEP \
            -e BT_HIDP \
            -e BT_LEDS \
            -e CFG80211_WEXT \
            -e NFC || true

          # USB — всё встроено, никаких модулей
          ./scripts/config --file out/.config \
            -e USB_CONFIGFS \
            -e USB_GADGET \
            -e USB_ETH \
            -e USB_MASS_STORAGE \
            -e USB_SERIAL \
            -e TUN \
            -e PPP || true

          ./scripts/config --file out/.config \
            -e PERF_EVENTS \
            -e TASK_IO_ACCOUNTING \
            -e CPUFREQ_STATS \
            -e FTRACE \
            -e FUNCTION_TRACER \
            -e DYNAMIC_FTRACE \
            -e UPROBE_EVENTS \
            -e TRACEPOINTS \
            -e BPF_EVENTS \
            -e KRETPROBES \
            -e HIST_TRIGGERS \
            -e SYNTH_EVENTS \
            -e IKCONFIG \
            -e IKCONFIG_PROC \
            -e UNIX \
            -e UNIX_DIAG \
            -e NETLINK_DIAG \
            -e PACKET_DIAG \
            -e INET_DIAG \
            -e FUTEX \
            -e PI_FUTEXES \
            -e INPUT_EVDEV \
            -e INPUT_UINPUT \
            -e HID_MULTITOUCH || true

          make $MAKE_FLAGS olddefconfig
          cp out/.config ../config_backup.txt
          echo "✅ Конфигурация готова ($(wc -l < out/.config) строк)"

      # ═══════════════════════════════════════════════════════════
      # ШАГ 12 — Компиляция ядра
      # ═══════════════════════════════════════════════════════════
      - name: 12. Компиляция ядра
        working-directory: kernel
        run: |
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache gcc" \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KSU_VERSION=11950 \
            KSU_SRC=$(pwd)/drivers/kernelsu \
            2>&1 | tee ../build.log

          if [ ! -f "out/arch/arm64/boot/Image" ] && \
             [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "❌ Image не найден — сборка провалилась!"
            echo "=== Последние 80 строк лога ==="
            tail -80 ../build.log
            exit 1
          fi

          ccache -s
          echo "✅ Ядро собрано!"
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || true

      # ═══════════════════════════════════════════════════════════
      # ШАГ 13 — Сохранение лога (исправлен путь)
      # ═══════════════════════════════════════════════════════════
      - name: 13. Сохранение лога сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # ═══════════════════════════════════════════════════════════
      # ШАГ 14 — Упаковка AnyKernel3 (block=auto)
      # ═══════════════════════════════════════════════════════════
      - name: 14. Упаковка AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3 \
            || { echo "❌ Не удалось клонировать AnyKernel3"; exit 1; }

          cd ak3

          sed -i "s|block=.*|block=auto|" anykernel.sh
          sed -i "s|do.devicecheck=.*|do.devicecheck=0|" anykernel.sh
          sed -i "s|#android.make=/system/bin/make|android.make=skip|" anykernel.sh

          if [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz ./
            echo "✅ Используем Image.gz"
          elif [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            cp ../kernel/out/arch/arm64/boot/Image ./
            echo "✅ Используем Image"
          else
            echo "❌ Нет образа ядра для упаковки"
            exit 1
          fi

          if [ -d ../kernel/out/arch/arm64/boot/dts ]; then
            cp -r ../kernel/out/arch/arm64/boot/dts ./
            echo "✅ DTB скопированы"
          fi

          ZIPNAME="GadzhiKernel-Vermeer-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIPNAME}" * -x .git README.md
          cd ..

          echo "✅ AnyKernel3 собран: ${ZIPNAME}"
          echo "zip_name=${ZIPNAME}" >> $GITHUB_ENV

      - name: Загрузка готового ядра
        uses: actions/upload-artifact@v4
        with:
          name: GadzhiKernel-Vermeer
          path: ${{ env.zip_name }}
          retention-days: 30
