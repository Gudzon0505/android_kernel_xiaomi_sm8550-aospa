name: ULTIMATE Vermeer Kernel (GKI 2.0 Certified)

on:
  workflow_dispatch:

jobs:
  build:
    name: SM8550 / Vermeer / POCO F6 Pro
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git gnupg gperf libssl-dev libxml2-utils zip zstd python3 dwarves libelf-dev ccache rsync device-tree-compiler lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: 2. Загрузка исходников (Vermeer T-OSS)
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-vermeer-t-oss
          fetch-depth: 1
          path: kernel

      - name: 3. Установка Clang 17.0.6 (Lunaris Match)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -LO https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf *.tar.xz --strip-components=1
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: 4. Интеграция ReSukiSU + SUSFS
        working-directory: kernel
        run: |
          # Внедрение KSU
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp
          mkdir -p drivers/kernelsu
          cp -af ksutmp/kernel/. drivers/kernelsu/
          sed -i '/git/,+4d' drivers/kernelsu/Kbuild
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # Патчинг SUSFS
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 susfs_patches
          patch -p1 < susfs_patches/kernel_patches/50_add_susfs_in_*.patch || true
          cp -r susfs_patches/kernel_patches/fs/* ./fs/
          cp -r susfs_patches/kernel_patches/include/linux/* ./include/linux/
          cd drivers/kernelsu && patch -p1 < "../../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true

      - name: 5. Хирургический фикс исходников Xiaomi
        working-directory: kernel
        run: |
          sed -i '/hwid\/Kconfig/d' drivers/misc/Kconfig
          sed -i '/susfs/d' fs/Kconfig
          echo 'source "fs/susfs/Kconfig"' >> fs/Kconfig

      - name: 6. Поиск конфига и генерация .config
        working-directory: kernel
        run: |
          DEF_FILE=$(find arch/arm64/configs -type f -name "*vermeer*defconfig*" | head -n 1)
          [ -z "$DEF_FILE" ] && DEF_FILE=$(find arch/arm64/configs -type f -name "*kalama*defconfig*" | head -n 1)
          [ -z "$DEF_FILE" ] && DEF_FILE="arch/arm64/configs/gki_defconfig"
          
          DEFCONFIG=$(echo "$DEF_FILE" | sed 's|arch/arm64/configs/||')
          echo "🚀 Выбран конфиг: $DEFCONFIG"
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          
          # Накатываем маскировку и турбо-твики (Исправлен флаг BTF)
          ./scripts/config --file out/.config \
            -e KSU -e KSU_SUSFS -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_SPOOF_CMDLINE \
            -e DEBUG_INFO_BTF -e KALLSYMS_ALL -e KPROBES \
            -e TCP_CONG_BBR --set-str DEFAULT_TCP_CONG bbr -e NET_SCH_FQ_CODEL \
            -e LRU_GEN -e LRU_GEN_ENABLED -e MQ_IOSCHED_KYBER
          
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 7. КОМПИЛЯЦИЯ
        working-directory: kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="clang" LD="ld.lld" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KSU_SRC=$(pwd)/drivers/kernelsu

      - name: 8. AnyKernel3 (Чистая упаковка GKI в BOOT)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          sed -i "s/device.name1=.*/device.name1=vermeer/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          
          # ПРАВИЛЬНЫЙ РАЗДЕЛ ДЛЯ ЯДРА (BOOT, НЕ INIT_BOOT!)
          sed -i 's|^block=.*|block=auto;|' anykernel.sh
          
          # Для GKI ядер копируем только чистый Image
          if [ -f ../kernel/out/arch/arm64/boot/Image ]; then
            echo "📦 Найдено ядро, пакуем..."
            cp ../kernel/out/arch/arm64/boot/Image ./
          else
            echo "❌ Файл ядра не найден!" && exit 1
          fi
          
          zip -r9 ../Gadzhi-Vermeer-Perfect.zip * -x .git README.md *placeholder

      - name: 9. Загрузка Артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Gadzhi-Vermeer-Perfect
          path: Gadzhi-Vermeer-Perfect.zip
