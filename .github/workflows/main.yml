name: Сборка ULTIMATE Vermeer Poco F6 Pro Lunaris 3.10

on:
  workflow_dispatch:
    inputs:
      target_partition:
        description: "Куда паковать kernel. Для Poco F6 Pro обычно boot. init_boot выбирай только если точно проверено."
        required: true
        default: "boot"
        type: choice
        options:
          - boot
          - init_boot

      kernel_ref:
        description: "Ветка исходников Xiaomi. Оставь auto, если не знаешь точное имя."
        required: true
        default: "auto"
        type: string

permissions:
  contents: read

env:
  TARGET_DEVICE: vermeer
  OUT_DIR: ${{ github.workspace }}/out
  KSU_DIR: ${{ github.workspace }}/drivers/kernelsu
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz

jobs:
  build:
    name: Компиляция SM8550 / Vermeer
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 1. Установка окружения
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            file \
            flex \
            git \
            gnupg \
            gperf \
            libelf-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            python3 \
            rsync \
            unzip \
            xz-utils \
            zip \
            zstd \
            dwarves \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

          echo "✅ Окружение установлено"

      - name: 2. Исходники Xiaomi Kernel OpenSource / Vermeer
        run: |
          set -e

          REPO_URL="https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
          USER_REF="${{ inputs.kernel_ref }}"

          echo "=== Репозиторий: $REPO_URL ==="
          echo "=== Запрошенная ветка: $USER_REF ==="

          echo "=== Показываем похожие ветки Xiaomi Kernel OpenSource ==="
          git ls-remote --heads "$REPO_URL" | grep -iE 'vermeer|kalama|sm8550|bsp' || true

          SELECTED_REF=""

          if [ "$USER_REF" != "auto" ] && [ -n "$USER_REF" ]; then
            echo "=== Проверяем пользовательскую ветку: $USER_REF ==="

            if git ls-remote --exit-code --heads "$REPO_URL" "$USER_REF" > /dev/null 2>&1; then
              SELECTED_REF="$USER_REF"
              echo "✅ Пользовательская ветка найдена: $SELECTED_REF"
            else
              echo "::error::Ветка '$USER_REF' не найдена в $REPO_URL"
              echo "Поставь kernel_ref=auto или укажи существующую ветку."
              exit 1
            fi
          else
            echo "=== Автопоиск подходящей ветки для Poco F6 Pro / vermeer ==="

            POSSIBLE_REFS=(
              "bsp-vermeer-u-oss"
              "vermeer-u-oss"
              "bsp-vermeer-t-oss"
              "vermeer-t-oss"
              "bsp-kalama-u-oss"
              "kalama-u-oss"
              "bsp-kalama-t-oss"
              "kalama-t-oss"
            )

            for ref in "${POSSIBLE_REFS[@]}"; do
              echo "Проверяем ветку: $ref"

              if git ls-remote --exit-code --heads "$REPO_URL" "$ref" > /dev/null 2>&1; then
                SELECTED_REF="$ref"
                echo "✅ Найдена ветка: $SELECTED_REF"
                break
              fi
            done
          fi

          if [ -z "$SELECTED_REF" ]; then
            echo "::error::Не найдена подходящая ветка vermeer/kalama в MiCode/Xiaomi_Kernel_OpenSource"
            echo "Выше в логе должен быть список похожих веток."
            echo "Попробуй вручную указать kernel_ref из списка."
            exit 1
          fi

          echo "=== Клонируем исходники Xiaomi: $SELECTED_REF ==="

          git clone --depth=1 --branch "$SELECTED_REF" "$REPO_URL" .

          echo "KERNEL_SOURCE_REF=$SELECTED_REF" >> "$GITHUB_ENV"

          echo "✅ Исходники скачаны из ветки: $SELECTED_REF"

          echo "=== Проверяем структуру исходников ==="
          ls -lah

          if [ ! -d arch/arm64/configs ]; then
            echo "::error::arch/arm64/configs не найден. Это не похоже на корень исходников kernel."
            exit 1
          fi

      - name: 3. Установка Clang 17.0.6
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/clang"
          cd "$GITHUB_WORKSPACE/clang"

          curl -fL -o clang.tar.xz "$CLANG_URL"
          tar -xJf clang.tar.xz --strip-components=1

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/clang/bin/clang" --version

          echo "✅ Clang установлен"

      - name: 4. Интеграция ReSukiSU + SUSFS
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          git_clone_retry() {
            for i in 1 2 3; do
              echo "Попытка git clone #$i: git clone $*"
              if git clone "$@"; then
                return 0
              fi
              echo "::warning::git clone не удался, повтор через 10 секунд..."
              sleep 10
            done

            echo "::error::git clone окончательно не удался: git clone $*"
            return 1
          }

          echo "=== Клонируем ReSukiSU ==="

          git ls-remote https://github.com/ReSukiSU/ReSukiSU.git || {
            echo "::error::Не удалось получить доступ к https://github.com/ReSukiSU/ReSukiSU.git"
            exit 1
          }

          git_clone_retry --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ksutmp

          if [ ! -d ksutmp/kernel ]; then
            echo "::error::В ReSukiSU не найдена папка kernel"
            echo "Содержимое ksutmp:"
            ls -lah ksutmp || true
            exit 1
          fi

          mkdir -p "$KSU_DIR"
          cp -af ksutmp/kernel/. "$KSU_DIR/"

          if [ -f "$KSU_DIR/Kbuild" ]; then
            sed -i '/git/,+4d' "$KSU_DIR/Kbuild" || true
          fi

          echo "=== Подключаем kernelsu в drivers/Makefile ==="

          if ! grep -q 'obj-y.*kernelsu/' drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          echo "=== Подключаем kernelsu Kconfig ==="

          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          echo "=== Клонируем SUSFS ==="

          git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git || {
            echo "::error::Не удалось получить доступ к https://gitlab.com/simonpunk/susfs4ksu.git"
            exit 1
          }

          if git ls-remote --exit-code --heads https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_BRANCH" > /dev/null 2>&1; then
            git_clone_retry --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs_patches
          else
            echo "::error::Ветка SUSFS '$SUSFS_BRANCH' не найдена"
            echo "Доступные похожие ветки:"
            git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git | grep -iE 'android13|5.15|gki' || true
            exit 1
          fi

          echo "=== Применяем основные SUSFS patches ==="

          shopt -s nullglob
          SUSFS_PATCHES=(susfs_patches/kernel_patches/50_add_susfs_in_*.patch)

          if [ ${#SUSFS_PATCHES[@]} -eq 0 ]; then
            echo "::warning::Не найдены патчи 50_add_susfs_in_*.patch"
          else
            for p in "${SUSFS_PATCHES[@]}"; do
              echo "Патч: $p"

              patch -p1 -N --no-backup-if-mismatch < "$p" || {
                echo "::warning::Патч $p применился не полностью или уже был применён. Продолжаем."
              }
            done
          fi

          echo "=== Копируем файлы SUSFS ==="

          if [ -d susfs_patches/kernel_patches/fs ]; then
            rsync -a susfs_patches/kernel_patches/fs/ ./fs/
          else
            echo "::warning::susfs_patches/kernel_patches/fs не найден"
          fi

          if [ -d susfs_patches/kernel_patches/include/linux ]; then
            rsync -a susfs_patches/kernel_patches/include/linux/ ./include/linux/
          else
            echo "::warning::susfs_patches/kernel_patches/include/linux не найден"
          fi

          echo "=== Патчим ReSukiSU под SUSFS ==="

          KSU_SUSFS_PATCH="$GITHUB_WORKSPACE/susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ -f "$KSU_SUSFS_PATCH" ]; then
            cd "$KSU_DIR"

            patch -p1 -N --no-backup-if-mismatch < "$KSU_SUSFS_PATCH" || {
              echo "::warning::10_enable_susfs_for_ksu.patch применился не полностью или уже был применён. Продолжаем."
            }

            cd "$GITHUB_WORKSPACE"
          else
            echo "::warning::10_enable_susfs_for_ksu.patch не найден"
          fi

          echo "KSU_SRC_PATH=$KSU_DIR" >> "$GITHUB_ENV"

          echo "✅ ReSukiSU + SUSFS подготовлены"

      - name: 5. Kconfig Fix для Xiaomi + SUSFS
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=== Проверяем битые source в drivers/misc/Kconfig ==="

          python3 <<'PY'
          import pathlib
          import re

          root = pathlib.Path.cwd()
          files = [
              root / "drivers/misc/Kconfig",
          ]

          source_re = re.compile(r'^(\s*)source\s+"([^"$]+)"\s*$')

          for kconfig in files:
              if not kconfig.exists():
                  print(f"::warning::{kconfig} не найден")
                  continue

              lines = kconfig.read_text(errors="ignore").splitlines()
              changed = False
              new_lines = []

              for line in lines:
                  match = source_re.match(line)
                  if match:
                      indent, path_text = match.groups()
                      target = root / path_text

                      if not target.exists():
                          print(f"::warning::Комментирую битый Kconfig source: {path_text}")
                          new_lines.append(f'{indent}# source "{path_text}"')
                          changed = True
                          continue

                  new_lines.append(line)

              if changed:
                  kconfig.write_text("\n".join(new_lines) + "\n")
          PY

          echo "=== Проверяем fs/susfs/Kconfig ==="

          if [ ! -f fs/susfs/Kconfig ]; then
            echo "::error::fs/susfs/Kconfig не найден. SUSFS скопировался неправильно."
            exit 1
          fi

          echo "=== Чисто вставляем SUSFS в fs/Kconfig ==="

          sed -i '\|source "fs/susfs/Kconfig"|d' fs/Kconfig

          if grep -q '^endmenu' fs/Kconfig; then
            sed -i '/^endmenu/i source "fs/susfs/Kconfig"' fs/Kconfig
          else
            echo 'source "fs/susfs/Kconfig"' >> fs/Kconfig
          fi

          echo "✅ Kconfig исправлен"

      - name: 6. Конфигурация Vermeer Defconfig
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p "$OUT_DIR"

          echo "=== Ищем defconfig ==="

          CONF_PATH="$(find arch/arm64/configs -name "vermeer_defconfig" | head -n 1 || true)"

          if [ -z "$CONF_PATH" ]; then
            CONF_PATH="$(find arch/arm64/configs -name "kalama_defconfig" | head -n 1 || true)"
          fi

          if [ -z "$CONF_PATH" ]; then
            echo "::error::Не найден vermeer_defconfig или kalama_defconfig"
            echo "Доступные defconfig:"
            find arch/arm64/configs -name "*defconfig" | sort | head -n 100
            exit 1
          fi

          DEFCONFIG="$(echo "$CONF_PATH" | sed 's|arch/arm64/configs/||')"

          echo "🚀 Используем defconfig: $DEFCONFIG"

          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG"

          chmod +x ./scripts/config || true

          echo "=== Включаем KernelSU / SUSFS / BTF ==="

          ./scripts/config --file "$OUT_DIR/.config" \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_SPOOF_CMDLINE \
            -d DEBUG_INFO_NONE \
            -d DEBUG_INFO_REDUCED \
            -d DEBUG_INFO_SPLIT \
            -e DEBUG_INFO \
            -e DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            -e DEBUG_INFO_BTF

          make O="$OUT_DIR" ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=== Проверка важных CONFIG ==="

          grep -E 'CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_DEBUG_INFO_BTF' "$OUT_DIR/.config" || true

          if ! grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config"; then
            echo "::error::CONFIG_KSU=y не включился. Проверь Kconfig ReSukiSU."
            exit 1
          fi

          if ! grep -q '^CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"; then
            echo "::warning::CONFIG_KSU_SUSFS=y не включился. Сборка продолжится, но SUSFS может быть неактивен."
          fi

          echo "✅ Конфигурация готова"

      - name: 7. Компиляция kernel Image.gz + DTBS
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "=== Clang version ==="
          clang --version

          echo "=== Начинаем сборку ==="

          make -j"$(nproc --all)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            KSU_SRC="$KSU_SRC_PATH" \
            Image.gz dtbs

          if [ ! -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "::error::Image.gz не найден после сборки"
            exit 1
          fi

          echo "✅ Kernel собран"
          ls -lh "$OUT_DIR/arch/arm64/boot/Image.gz"

      - name: 8. Упаковка AnyKernel3
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          TARGET_PARTITION="${{ inputs.target_partition }}"
          ZIP_NAME="Gadzhi-Vermeer-Lunaris310-${TARGET_PARTITION}.zip"

          echo "=== Target partition: $TARGET_PARTITION ==="

          if [ "$TARGET_PARTITION" != "boot" ] && [ "$TARGET_PARTITION" != "init_boot" ]; then
            echo "::error::Неверный target_partition: $TARGET_PARTITION"
            exit 1
          fi

          git_clone_retry() {
            for i in 1 2 3; do
              echo "Попытка git clone #$i: git clone $*"
              if git clone "$@"; then
                return 0
              fi
              echo "::warning::git clone не удался, повтор через 10 секунд..."
              sleep 10
            done

            echo "::error::git clone окончательно не удался: git clone $*"
            return 1
          }

          echo "===
