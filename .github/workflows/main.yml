name: Сборка ULTIMATE Vermeer (Audited & Fixed v2)

on:
  workflow_dispatch:

jobs:
  build:
    name: Компиляция (SM8550 / Vermeer)
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "5G"
      KBUILD_BUILD_USER: "gadzhi"
      KBUILD_BUILD_HOST: "github-actions"

    steps:
      # ───────────────────────────────────────────────
      - name: 1. Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git gnupg gperf \
            libssl-dev libxml2-utils zip zstd python3 \
            dwarves libelf-dev ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler
          echo "✅ Окружение готово"

      # ───────────────────────────────────────────────
      - name: 2. Загрузка исходников ядра в подпапку kernel/
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: bsp-vermeer-t-oss
          fetch-depth: 1
          path: kernel

      # ───────────────────────────────────────────────
      - name: 3. Кэш Clang 17.0.6
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: clang-17-0-6-ubuntu22

      - name: 4. Установка Clang (если нет в кэше)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -L -o clang.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xJf clang.tar.xz --strip-components=1
          rm clang.tar.xz

      - name: 5. Добавление Clang в PATH
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/clang/bin/clang --version

      # ───────────────────────────────────────────────
      - name: 6. Кэш ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-vermeer-${{ github.run_id }}
          restore-keys: ccache-vermeer-

      # ───────────────────────────────────────────────
      - name: 7. Интеграция ReSukiSU (KernelSU)
        working-directory: kernel
        run: |
          set -e
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git ../ksutmp
          
          if [ ! -d ../ksutmp/kernel ]; then
            echo "❌ ReSukiSU: папка 'kernel' не найдена в репозитории"
            ls -la ../ksutmp
            exit 1
          fi
          
          mkdir -p drivers/kernelsu
          cp -af ../ksutmp/kernel/. drivers/kernelsu/
          
          # Точечный фикс: убираем только setlocalversion проверку из Kbuild
          if [ -f drivers/kernelsu/Kbuild ]; then
            sed -i '/getKernelSUVersion/,/endif/d' drivers/kernelsu/Kbuild 2>/dev/null || true
            sed -i '/setlocalversion/d' drivers/kernelsu/Kbuild 2>/dev/null || true
          fi
          
          # Регистрация в драйверах
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # Регистрация в Kconfig (перед endmenu)
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          
          echo "KSU_SRC_PATH=$(pwd)/drivers/kernelsu" >> $GITHUB_ENV
          echo "✅ KernelSU интегрирован"

      # ───────────────────────────────────────────────
      - name: 8. Интеграция SUSFS (правильный порядок)
        working-directory: kernel
        run: |
          set -e
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android13-5.15 \
            ../susfs_patches
          
          # Шаг А: копируем новые файлы (fs/susfs.c, include/linux/susfs.h и т.д.)
          if [ -d ../susfs_patches/kernel_patches/fs ]; then
            cp -r ../susfs_patches/kernel_patches/fs/* ./fs/ 2>/dev/null || true
          fi
          if [ -d ../susfs_patches/kernel_patches/include/linux ]; then
            cp -r ../susfs_patches/kernel_patches/include/linux/* ./include/linux/ 2>/dev/null || true
          fi
          
          # Шаг Б: применяем патч к существующим файлам
          PATCH=$(ls ../susfs_patches/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch \
                     ../susfs_patches/kernel_patches/50_add_susfs_in_gki_android13_5.15.patch \
                     2>/dev/null | head -1)
          if [ -n "$PATCH" ]; then
            echo "📦 Применяем: $PATCH"
            patch -p1 < "$PATCH" || echo "⚠️ Некоторые hunks не применились (см. *.rej)"
          else
            echo "❌ SUSFS патч не найден!"
            ls ../susfs_patches/kernel_patches/
            exit 1
          fi
          
          # Шаг В: патч KernelSU для поддержки SUSFS
          KSU_PATCH="../susfs_patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            ( cd drivers/kernelsu && patch -p1 < "../../$KSU_PATCH" ) \
              || echo "⚠️ KSU патч неполный (возможно, уже встроен)"
          fi
          
          # Проверка
          if [ -f fs/susfs.c ] || [ -d fs/susfs ]; then
            echo "✅ SUSFS файлы на месте"
          else
            echo "⚠️ SUSFS файлы не обнаружены"
          fi

      # ───────────────────────────────────────────────
      - name: 9. Конфигурация ядра
        working-directory: kernel
        run: |
          set -e
          
          # Многоуровневый поиск defconfig
          CONF_PATH=""
          for name in vermeer_defconfig vendor/vermeer_defconfig \
                      kalama_defconfig vendor/kalama_defconfig \
                      vendor/kalama_GKI.config gki_defconfig; do
            if [ -f "arch/arm64/configs/$name" ]; then
              CONF_PATH="arch/arm64/configs/$name"
              DEFCONFIG="$name"
              break
            fi
          done
          
          if [ -z "$CONF_PATH" ]; then
            echo "❌ Defconfig не найден! Доступные:"
            find arch/arm64/configs -type f
            exit 1
          fi
          
          echo "🚀 Используем: $DEFCONFIG"
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out "$DEFCONFIG"
          
          # Включаем KSU + SUSFS (БЕЗ префикса CONFIG_)
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KALLSYMS_ALL \
            -e KPROBES \
            -e DEBUG_INFO_BTF
          
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out olddefconfig
          
          echo "=== KSU/SUSFS финальные значения ==="
          grep -E "^CONFIG_(KSU|SUSFS)" out/.config || echo "⚠️ Опции не активны"

      # ───────────────────────────────────────────────
      - name: 10. Компиляция ядра
        working-directory: kernel
        run: |
          set -e
          export PATH="/usr/lib/ccache:$PATH"
          
          make -j$(nproc --all) \
            ARCH=arm64 \
            O=out \
            LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KSU_SRC=$KSU_SRC_PATH \
            2>&1 | tee build.log
          
          echo ""
          echo "=== Артефакты сборки ==="
          ls -la out/arch/arm64/boot/ || true
          
          ccache -s

      # ───────────────────────────────────────────────
      - name: 11. Сборка AnyKernel3 ZIP
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          # Настройка под Vermeer
          sed -i 's|kernel.string=.*|kernel.string=Gadzhi-Vermeer ULTIMATE|' anykernel.sh
          sed -i 's|do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=vermeer|' anykernel.sh
          sed -i 's|device.name2=.*|device.name2=Vermeer|' anykernel.sh
          sed -i 's|device.name3=.*|device.name3=POCO F6 Pro|' anykernel.sh
          sed -i 's|device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|supported.versions=.*|supported.versions=|' anykernel.sh
          sed -i 's|is_slot_device=.*|is_slot_device=1|' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/init_boot|' anykernel.sh
          
          # Копируем ядро (приоритет Image.gz для экономии места, fallback на Image)
          BOOT_DIR="../kernel/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz" ]; then
            cp "$BOOT_DIR/Image.gz" ./
            echo "✅ Скопирован Image.gz ($(du -h Image.gz | cut -f1))"
          elif [ -f "$BOOT_DIR/Image" ]; then
            cp "$BOOT_DIR/Image" ./
            echo "✅ Скопирован Image ($(du -h Image | cut -f1))"
          else
            echo "❌ Ядро не найдено!"
            ls "$BOOT_DIR"
            exit 1
          fi
          
          # Склейка DTB через cat (НЕ перезапись!)
          DTB_DIR="$BOOT_DIR/dts/vendor/qcom"
          if [ -d "$DTB_DIR" ]; then
            DTBS=$(find "$DTB_DIR" -name "*kalama*.dtb" 2>/dev/null)
            if [ -n "$DTBS" ]; then
              > dtb  # очистка
              for f in $DTBS; do
                cat "$f" >> dtb
              done
              echo "✅ DTB склеен: $(du -h dtb | cut -f1)"
            else
              echo "⚠️ DTB файлы kalama не найдены"
            fi
          fi
          
          DATE=$(date +%Y%m%d-%H%M)
          ZIP_NAME="Gadzhi-Vermeer-Final-${DATE}.zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Создан: $ZIP_NAME ($(du -h "../$ZIP_NAME" | cut -f1))"

      # ───────────────────────────────────────────────
      - name: 12. Загрузка ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: 13. Загрузка build.log (всегда)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
