name: Проверка веток Vermeer

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Список всех веток MiCode для Vermeer
        run: |
          echo "=== Все ветки с 'vermeer' в названии ==="
          git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            | grep -i vermeer || echo "Ничего не найдено"
          
          echo ""
          echo "=== Все ветки с 'kalama' (SM8550 платформа) ==="
          git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            | grep -i kalama || echo "Ничего не найдено"
          
          echo ""
          echo "=== Все ветки (полный список, если их немного) ==="
          git ls-remote --heads https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            | awk '{print $2}' | sed 's|refs/heads/||' | sort

      - name: Список веток SUSFS
        run: |
          echo "=== Ветки SUSFS ==="
          git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git \
            | awk '{print $2}' | sed 's|refs/heads/||' | sort
